<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mmụta Igbo</title>
  <meta name="description" content="Learn Igbo every day: sections, lessons and daily tests built from free resources.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1f2b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Igbo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Fonts: Nunito (display, 700–900) + Noto Sans (body and every Igbo string, 400–700). Cached by sw.js for offline use;
       the system fallbacks in css/style.css take over if they never load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦅</text></svg>">
</head>
<body class="text-body">
  <header class="mi-topbar">
    <button class="mi-brand text-heading" data-nav="home" aria-label="Mmụta Igbo, home"><span class="mi-brand-mark" aria-hidden="true"><svg class="mi-icon" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h8"/></svg></span><span>Mmụta Igbo</span></button>
    <div class="mi-stats">
      <span class="mi-stat text-option" title="Day streak"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg><span class="sr-only">Day streak</span><b id="stat-streak">0</b></span>
      <span class="mi-stat text-option" title="Total XP"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span class="sr-only">Total XP</span><b id="stat-xp">0</b></span>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="mi-tabbar" aria-label="Main">
    <button class="mi-tab text-caption" data-nav="home"><span class="mi-tab-pill"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>Learn</button>
    <button class="mi-tab text-caption" data-nav="daily"><span class="mi-tab-pill"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 14l2 2 4-4"/></svg></span>Daily test</button>
    <button class="mi-tab text-caption" data-nav="words"><span class="mi-tab-pill"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h8"/></svg></span>Words</button>
    <button class="mi-tab text-caption" data-nav="letters"><span class="mi-tab-pill"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19l4.5-12 4.5 12"/><path d="M4 15h6"/><path d="M21 19v-7a3 3 0 0 0-5.5-1.7"/><circle cx="17.5" cy="15.5" r="3.5"/></svg></span>Letters</button>
    <button class="mi-tab text-caption" data-nav="more"><span class="mi-tab-pill"><svg class="mi-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>More</button>
  </nav>

  <script src="data/curriculum.js"></script>
  <script src="data/audio.js"></script><!-- optional: app works without it -->
  <script>window.AUDIO = window.AUDIO || {};</script>
  <script src="js/app.js"></script>
</body>
</html>
